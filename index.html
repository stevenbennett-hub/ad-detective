<style>
@font-face { font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 400; font-display: swap; src: url(assets/fonts/atkinson-hyperlegible-next-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Atkinson Hyperlegible Next"; font-style: normal; font-weight: 700; font-display: swap; src: url(assets/fonts/atkinson-hyperlegible-next-latin-700-normal.woff2) format("woff2"); }
@font-face { font-family: "Bricolage Grotesque"; font-style: normal; font-weight: 200 800; font-display: swap; src: url(assets/fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2-variations"); }
/* Ad Detective — design tokens. Accents always mean the same thing:
   amber = evidence you marked / an appeal; coral = a flaw or misleading claim; teal = sound reasoning. */
:root {
  --bg: #0F1626; --panel: #172036; --panel2: #1E2943; --line: #33415F;
  --text: #EEF2F8; --muted: #AEB9CD;
  --evidence: #F5B83D; --flaw: #FF8270; --sound: #52D6BC; --focus: #FFE08A;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", Verdana, system-ui, sans-serif;
  --r-sm: 6px; --r-md: 12px; --r-lg: 20px;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 90px; }
body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--evidence); text-underline-offset: 3px; }
a:hover { color: var(--focus); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.12; margin: 0 0 .5em; letter-spacing: -.01em; }
h1 { font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; }
h2 { font-size: 1.6rem; font-weight: 750; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { margin: 0 0 1em; }
.wrap { width: min(1180px, 100% - 40px); margin-inline: auto; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.lead { font-size: 1.12rem; max-width: 68ch; }
.skip { position: absolute; left: 12px; top: -60px; background: var(--evidence); color: var(--bg); padding: 10px 16px; border-radius: var(--r-sm); font-weight: 700; z-index: 50; }
.skip:focus { top: 12px; }
.warn { background: #3A2A12; border: 1px solid var(--evidence); padding: 10px 14px; border-radius: var(--r-sm); margin-top: 10px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 9px 18px; border-radius: 999px; border: 2px solid var(--line); background: var(--panel2); color: var(--text); font: 700 1rem var(--body); cursor: pointer; text-decoration: none; }
.btn:hover { border-color: var(--muted); color: var(--text); }
.btn.primary { background: var(--evidence); border-color: var(--evidence); color: #1A1306; }
.btn.primary:hover { background: var(--focus); border-color: var(--focus); color: #1A1306; }
.btn.danger { border-color: var(--flaw); color: var(--flaw); background: transparent; }
.btn.sm { min-height: 38px; padding: 6px 14px; font-size: .95rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { background: none; border: 0; padding: 4px 0; color: var(--evidence); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 14px 0; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 20; background: rgba(15, 22, 38, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.topin { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 0; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--text); text-decoration: none; }
.brand b { display: block; font: 800 1.2rem var(--display); }
.brand small { display: block; color: var(--muted); font-size: .8rem; }
.top nav ul { display: flex; flex-wrap: wrap; gap: 4px; list-style: none; margin: 0; padding: 0; }
.top nav a { display: block; padding: 8px 12px; border-radius: 999px; color: var(--text); text-decoration: none; font-weight: 700; }
.top nav a:hover { background: var(--panel2); }
.top nav a[aria-current="page"] { background: var(--panel2); box-shadow: inset 0 -3px 0 var(--evidence); }
.switches { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.seg { display: inline-flex; border: 2px solid var(--line); border-radius: 999px; padding: 2px; }
.seg button { border: 0; background: none; color: var(--muted); font: 700 .88rem var(--body); padding: 6px 12px; border-radius: 999px; cursor: pointer; min-height: 34px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }

/* Hero */
.hero { padding: 46px 0 36px; border-bottom: 1px solid var(--line); background: radial-gradient(1200px 500px at 85% 0%, #1F2C4D 0%, transparent 60%); }
.herogrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 40px; align-items: center; }
.herotext h1 { font-size: clamp(3rem, 7vw, 5.6rem); font-weight: 800; letter-spacing: -.035em; line-height: .95; margin-bottom: .2em; }
.herotext .sub { font: 600 1.35rem/1.3 var(--display); color: var(--evidence); max-width: 26ch; }
.herotext .lede { color: var(--muted); max-width: 52ch; }
.specimen { margin: 0; }
.frame { position: relative; aspect-ratio: 16 / 10; border-radius: var(--r-lg); overflow: hidden; background: linear-gradient(160deg, #241808 0%, #0A0E18 70%); border: 1px solid var(--line); }
.beam { position: absolute; inset: -20% 25% 0 35%; background: radial-gradient(closest-side, rgba(245, 184, 61, .35), transparent); filter: blur(10px); }
.bottle { position: absolute; left: 46%; top: 16%; height: 66%; fill: #E9A23B; stroke: #FFD48A; stroke-width: 1.2; }
.bottle .lbl { fill: #2A1A05; }
.slogan { position: absolute; left: 6%; bottom: 14%; max-width: 38%; line-height: 1.05; margin: 0; font: 800 clamp(1.3rem, 2.6vw, 2.1rem) var(--display); letter-spacing: -.02em; color: #FFF3DC; }
.fine { position: absolute; left: 6%; bottom: 7%; margin: 0; font-size: .72rem; color: #CDBFA6; }
.note { position: absolute; max-width: 40%; padding: 8px 12px; border-radius: var(--r-sm); background: rgba(10, 14, 24, .92); font-size: .86rem; line-height: 1.35; border-left: 4px solid; opacity: 0; transform: translateY(6px); }
.note i { display: block; font-style: normal; font-weight: 700; font-size: .78rem; }
.n1 { right: 4%; top: 8%; border-color: var(--evidence); } .n1 i { color: var(--evidence); }
.n2 { right: 4%; top: 40%; border-color: var(--flaw); } .n2 i { color: var(--flaw); }
.n3 { right: 4%; bottom: 6%; border-color: var(--sound); } .n3 i { color: var(--sound); }
.specimen.play .note { animation: noteIn .5s ease forwards; }
.specimen.play .n1 { animation-delay: .5s; } .specimen.play .n2 { animation-delay: 1.4s; } .specimen.play .n3 { animation-delay: 2.3s; }
.specimen.still .note { opacity: 1; transform: none; }
@keyframes noteIn { to { opacity: 1; transform: none; } }
.specimen figcaption { margin-top: 10px; color: var(--muted); font-size: .92rem; }

/* Home blocks */
.block { padding: 40px 0 10px; }
.caselist { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; }
.caserow { display: flex; align-items: center; gap: 16px; padding: 14px 18px; border-radius: var(--r-md); background: var(--panel); border: 1px solid var(--line); color: var(--text); text-decoration: none; }
.caserow:hover { border-color: var(--evidence); color: var(--text); }
.caserow.final { border-style: dashed; }
.cname { display: block; font: 750 1.15rem var(--display); }
.cfocus { display: block; color: var(--muted); font-size: .92rem; }
.ringph { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 50%; border: 2px dashed var(--line); font: 800 1.1rem var(--display); color: var(--muted); flex: none; }
.ring { flex: none; }
.ring path { fill: none; stroke: var(--line); stroke-width: 5; stroke-linecap: round; transition: stroke .3s; }
.ring path.on { stroke: var(--sound); }
.ring text { fill: var(--text); font: 800 15px var(--display); }
.distinct { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.dk { padding: 16px 18px; border-radius: var(--r-md); background: var(--panel); border-top: 4px solid var(--line); }
.dk-appeal { border-top-color: var(--evidence); } .dk-fallacy, .dk-misleading { border-top-color: var(--flaw); } .dk-ethical { border-top-color: var(--sound); }
.dk p { margin-bottom: .5em; } .dq { color: var(--muted); font-style: italic; }
.cycle { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; padding: 0; list-style: none; counter-reset: c; }
.cycle li { counter-increment: c; padding: 14px 16px; background: var(--panel); border-radius: var(--r-md); }
.cycle li::before { content: counter(c); display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--panel2); font: 800 .9rem var(--display); margin-bottom: 6px; }
.cycle b { display: block; } .cycle span { color: var(--muted); font-size: .92rem; }

/* Case */
.casehead { padding-top: 26px; }
.crumb { color: var(--muted); font-size: .92rem; }
.ctitle { display: flex; gap: 16px; align-items: center; }
.ctitle h1 { margin: 0; } .ctitle .sub { color: var(--muted); margin: 4px 0 0; }
.steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 22px 0 0; border-bottom: 1px solid var(--line); }
.steps button { display: flex; align-items: center; gap: 8px; border: 0; background: none; color: var(--muted); font: 700 1rem var(--body); padding: 10px 14px; border-bottom: 3px solid transparent; cursor: pointer; min-height: 44px; }
.steps button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--evidence); }
.steps .sn { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--panel2); font-size: .85rem; }
.steps .complete .sn { background: var(--sound); color: var(--bg); }
.panel { padding: 26px 0 30px; }
.panel > h2 { font-size: 1.4rem; }
.meta { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; max-width: 80ch; }
.meta dt { color: var(--muted); font-weight: 700; } .meta dd { margin: 0; }
.vocab { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; margin: 10px 0 22px; }
.vc { background: var(--panel); border-radius: var(--r-md); padding: 14px 16px; border-left: 4px solid var(--evidence); }
.vc p { margin: 0 0 .4em; } .vt { font: 750 1.08rem var(--display); } .vx { color: var(--muted); font-style: italic; font-size: .94rem; }
.example { max-width: 72ch; background: var(--panel); padding: 14px 18px; border-radius: var(--r-md); }
.stepnav { display: flex; justify-content: space-between; gap: 10px; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }

/* Player and transcript */
.player { position: relative; max-width: 860px; margin: 8px 0 18px; }
.player video { width: 100%; border-radius: var(--r-md); background: #000; display: block; }
.placeholder { display: flex; gap: 14px; align-items: center; padding: 26px; border-radius: var(--r-md); border: 2px dashed var(--line); background: var(--panel); color: var(--muted); }
.placeholder p { margin: 0; max-width: 52ch; }
.transcript { max-width: 860px; background: var(--panel); border-radius: var(--r-md); padding: 16px 18px; margin-bottom: 16px; }
.transcript ol { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.transcript li { display: grid; grid-template-columns: 56px 96px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.ts { font: 700 .85rem var(--body); color: var(--evidence); background: var(--panel2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px 6px; cursor: pointer; min-height: 30px; }
.kind { color: var(--muted); font-size: .85rem; font-weight: 700; }
.tk-n .tx { font-weight: 700; } .tk-x .tx { color: var(--evidence); } .tk-s .tx, .tk-v .tx { color: var(--muted); }
.orig { display: block; color: var(--muted); font-size: .86rem; font-weight: 400; }

/* Evidence cards (the memorable element) */
.cards { list-style: none; padding: 0; display: grid; gap: 14px; max-width: 900px; }
.card { background: var(--panel); border-radius: var(--r-md); padding: 16px 18px; border: 1px solid var(--line); border-left: 6px solid var(--line); transition: border-color .25s; }
.card.tagged { border-left-color: var(--evidence); }
.ch { display: flex; gap: 10px; align-items: baseline; margin-bottom: 10px; }
.ch .mq { font: 700 1.06rem var(--display); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
.chip { border: 2px solid var(--line); background: transparent; color: var(--text); border-radius: 999px; padding: 4px 12px; font: 700 .86rem var(--body); cursor: pointer; min-height: 34px; }
.chip[aria-pressed="true"].t-appeal { background: var(--evidence); border-color: var(--evidence); color: #1A1306; }
.chip[aria-pressed="true"].t-flaw { background: var(--flaw); border-color: var(--flaw); color: #22090A; }
.chip[aria-pressed="true"].t-sound { background: var(--sound); border-color: var(--sound); color: #052019; }
.chip[aria-pressed="true"]::before { content: "\2713\00a0"; }
.lbl { display: block; font-weight: 700; margin: 8px 0 4px; }
textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 2px solid var(--line); border-radius: var(--r-sm); padding: 9px 11px; }
select { width: auto; max-width: 100%; min-height: 40px; }
textarea:focus, select:focus { border-color: var(--evidence); outline: none; box-shadow: 0 0 0 3px rgba(245, 184, 61, .3); }
.cmp p { margin: 8px 0 0; } .cmp .ok { color: var(--sound); } .cmp .miss { color: var(--evidence); } .cmp .extra { color: var(--flaw); } .cmp .why { color: var(--text); }
.card .btn { margin-top: 8px; }
.own { max-width: 900px; margin-top: 16px; background: var(--panel); border-radius: var(--r-md); padding: 12px 18px; }
.own summary { cursor: pointer; font-weight: 700; min-height: 32px; }
.ownlist { padding-left: 20px; } .ownlist li { margin: 6px 0; }

/* Questions */
.q { border: 1px solid var(--line); border-radius: var(--r-md); padding: 16px 18px 18px; margin: 0 0 18px; max-width: 900px; background: var(--panel); }
.q legend { font: 700 1.08rem/1.35 var(--display); padding: 0 6px; max-width: 70ch; }
.opts { display: grid; gap: 8px; margin-top: 6px; }
.opt { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 2px solid var(--line); border-radius: var(--r-sm); cursor: pointer; background: var(--bg); }
.opt input { margin-top: 5px; accent-color: var(--evidence); width: 18px; height: 18px; flex: none; }
.opt.right { border-color: var(--sound); } .opt.wrong { border-color: var(--flaw); }
.fb p, .grid p, .q > p { margin: 10px 0 0; }
.ok { color: var(--sound); } .no { color: var(--flaw); } .fb .ok, .fb .no { color: var(--text); padding: 10px 12px; border-radius: var(--r-sm); border-left: 4px solid; }
.fb .ok { border-color: var(--sound); background: rgba(82, 214, 188, .08); } .fb .no { border-color: var(--flaw); background: rgba(255, 130, 112, .08); }
.hintp { color: var(--evidence); }
.grid { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 12px; }
.grid li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 260px); gap: 6px 14px; align-items: center; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.grid li > p { grid-column: 1 / -1; }
.inspect { list-style: none; padding: 0; display: grid; gap: 16px; }
.claim { font: 700 1.05rem var(--display); color: var(--evidence); margin: 0; }
.reveal { margin-top: 10px; padding: 12px 14px; border-radius: var(--r-sm); background: var(--bg); border-left: 4px solid var(--sound); }
.reveal h4 { font-size: 1rem; } .reveal ul { margin: 0; padding-left: 20px; }
.checks { display: grid; gap: 6px; margin: 10px 0; border: 0; padding: 0; }
.checks legend { font-weight: 700; margin-bottom: 4px; padding: 0; }
.checks input { width: 18px; height: 18px; accent-color: var(--sound); vertical-align: -3px; margin-right: 6px; }
.frame { color: var(--muted); } .linkbtn.frame { display: block; color: var(--evidence); margin-bottom: 4px; }
.write { max-width: 900px; margin-bottom: 18px; }
.count { color: var(--muted); font-size: .85rem; margin: 4px 0 0; }
.colbox { max-width: 900px; border: 2px solid var(--evidence); border-radius: var(--r-md); padding: 4px 18px 4px; margin: 10px 0 18px; }
.colbox h3 { margin-top: 12px; color: var(--evidence); }
.xfer { max-width: 900px; }
.done { color: var(--sound); font: 750 1.2rem var(--display); }

/* Notebook, report, teacher */
.nbcase { margin: 26px 0; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.nbcase h2 { display: flex; gap: 12px; align-items: center; font-size: 1.3rem; }
.nbcards { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.ecard { background: var(--panel); border-radius: var(--r-md); padding: 12px 14px; border-top: 4px solid var(--evidence); }
.ecard.own { border-top-color: var(--sound); }
.ecard .mq, .ecard q { display: block; font: 700 1rem var(--display); margin: 6px 0; } .ecard p { margin: 4px 0 0; }
.etag { display: inline-block; font-size: .8rem; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin: 0 4px 4px 0; }
.etag.t-appeal { background: var(--evidence); color: #1A1306; } .etag.t-flaw { background: var(--flaw); color: #22090A; } .etag.t-sound { background: var(--sound); color: #052019; }
.nbw { max-width: 80ch; }
.emptyst { background: var(--panel); padding: 18px; border-radius: var(--r-md); }
.exportbox { margin: 30px 0; padding: 18px 20px; background: var(--panel); border-radius: var(--r-md); max-width: 900px; }
.filebtn { position: relative; }
.seg.big { display: flex; flex-wrap: wrap; gap: 10px; border: 0; padding: 0; margin: 0 0 18px; }
.seg.big legend { font-weight: 700; margin-bottom: 8px; width: 100%; }
.seg.big label { display: flex; align-items: center; gap: 8px; padding: 10px 16px; border: 2px solid var(--line); border-radius: 999px; cursor: pointer; }
.seg.big input { accent-color: var(--evidence); width: 18px; height: 18px; }
.storyboard { max-width: 900px; background: var(--panel); border-radius: var(--r-md); padding: 16px 20px; margin-bottom: 20px; }
.storyboard ol { list-style: none; padding: 0; display: grid; gap: 8px; }
.storyboard li { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; }
.progressline { font-weight: 700; color: var(--sound); }
.rubric { max-width: 1000px; margin-top: 20px; } .rubric summary { cursor: pointer; font-weight: 700; min-height: 36px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .94rem; }
th, td { text-align: left; vertical-align: top; padding: 10px; border-bottom: 1px solid var(--line); }
thead th { color: var(--muted); }
.taglegend { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.teacher h2 { margin-top: 1.4em; } .plain { padding-left: 22px; max-width: 80ch; } .plain li { margin: 6px 0; }
code { background: var(--panel2); padding: 1px 6px; border-radius: 4px; font-size: .9em; }
.foot { margin-top: 50px; border-top: 1px solid var(--line); padding: 24px 0 40px; color: var(--muted); font-size: .92rem; }
.foot p { max-width: 80ch; }

@media (max-width: 900px) {
  .herogrid { grid-template-columns: 1fr; }
  .transcript li { grid-template-columns: 52px minmax(0, 1fr); } .transcript .kind { grid-column: 2; }
  .grid li { grid-template-columns: 1fr; }
}
@media (max-width: 560px) {
  .note { position: static; display: block; max-width: none; margin: 8px; opacity: 1; transform: none; }
  .frame { aspect-ratio: auto; min-height: 380px; }
  .switches { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  .note { opacity: 1; transform: none; }
}

<body>
<div id="app"><p style="padding:2rem">Ad Detective needs JavaScript to run.</p></div>
<script>
/* Ad Detective: The Art of Persuasion — all course content.
   Edit this file to change text. Pairs are [English, Español].
   Every brand, person, product, and statistic in the ads is invented for instruction.
   Answer keys are NOT kept here beyond the feedback students see; the full instructor analysis lives in the teacher's private planning document. */
window.AD = (function () {
  const D = {};

  /* ---------- Video manifest: add the exported MP4s and captions at these paths. Missing files show a placeholder. ---------- */
  D.MEDIA_DIR = "assets/videos/";
  D.CAPTION_DIR = "assets/captions/";

  /* ---------- Technique tags students apply to evidence ---------- */

 "Bandwagon is about “everyone.” FOMO is about being left out. Belonging is about joining a group.": "El efecto de arrastre habla de “todos”. El miedo a perderse algo habla de quedarse fuera. La pertenencia habla de unirse a un grupo.",
 "Bandwagon": "Efecto de arrastre (bandwagon)",
 "Fear of missing out": "Miedo a perderse algo",
 "Belonging and identity": "Pertenencia e identidad",
 "“Everybody's switching to Strideborne Drift.”": "“Todos se están cambiando a Strideborne Drift.”",
 "“Everybody” is the bandwagon signal.": "“Todos” es la señal del efecto de arrastre.",
 "“Still wearing last year's look?”": "“¿Todavía con el estilo del año pasado?”",
 "It makes not having the shoe feel embarrassing and outdated.": "Hace que no tener los tenis se sienta vergonzoso y anticuado.",
 "“Don't get left behind.”": "“No te quedes atrás.”",
 "A direct warning about being left out. It also works as bandwagon.": "Una advertencia directa sobre quedarse fuera. También funciona como efecto de arrastre.",
 "“Find your crew.”": "“Encuentra a tu grupo.”",
 "Buying the shoe is framed as joining a group.": "Comprar los tenis se presenta como unirse a un grupo.",
 "#DriftNation": "#DriftNation",
 "A hashtag that turns customers into a “nation” you can belong to.": "Un hashtag que convierte a los clientes en una “nación” a la que puedes pertenecer.",
 "What does the ad never tell you about the sneakers?": "¿Qué es lo que el anuncio nunca te dice sobre los tenis?",
 "List everything you'd want to know before buying shoes.": "Haz una lista de todo lo que querrías saber antes de comprar unos tenis.",
 "That they're popular": "Que son populares",
 "That's almost all it tells you.": "Eso es casi lo único que te dice.",
 "Whether they're comfortable, durable, well made, or worth the price": "Si son cómodos, duraderos, bien hechos o si valen lo que cuestan",
 "Yes. The ad sells belonging and leaves out everything about the shoe itself.": "Sí. El anuncio vende pertenencia y deja fuera todo sobre los tenis mismos.",
 "What color they are": "De qué color son",
 "The ad shows the color clearly.": "El anuncio muestra el color claramente.",
 "Targeting young people's need to belong is effective. Is it fair? Consider who might be affected.": "Apelar a la necesidad de pertenencia de los jóvenes es efectivo. ¿Es justo? Considera a quién podría afectar.",
 "This ad is effective because ___. However, it could affect ___ because ___.": "Este anuncio es efectivo porque ___. Sin embargo, podría afectar a ___ porque ___.",
 "I explained why the appeal works.": "Expliqué por qué funciona la apelación.",
 "I named who might be affected.": "Nombré a quién podría afectar.",
 "I avoided saying all fashion advertising is unethical.": "Evité decir que toda la publicidad de moda es poco ética.",
 "How does the ad define who belongs? Who is absent from the “crew,” and what does that suggest about the target audience?": "¿Cómo define el anuncio quién pertenece? ¿Quién no aparece en el “grupo” y qué sugiere eso sobre el público objetivo?",
 "The ad defines belonging as ___. It leaves out ___, which suggests ___.": "El anuncio define la pertenencia como ___. Deja fuera a ___, lo cual sugiere ___.",
 "“Either you join the debate team, or you'll never be a good speaker.” That's a false dilemma: you could take a speech class, practice at home, or join a different club. Compare: “The bus leaves at 7:10. Either you're on it, or you'll need another ride.” That one is a genuine two-option situation.": "“O te unes al equipo de debate, o nunca serás un buen orador.” Eso es un falso dilema: podrías tomar una clase de oratoria, practicar en casa o unirte a otro club. Compara: “El autobús sale a las 7:10. O estás en él, o necesitarás otro transporte.” Esa sí es una situación con dos opciones reales.",
 "Think of an ad, announcement, or argument that offered only two options. Were there really only two? Name one option it left out.": "Piensa en un anuncio, aviso o argumento que ofreciera solo dos opciones. ¿De verdad había solo dos? Nombra una opción que dejó fuera.",
 "“There are two kinds of students”": "“Hay dos tipos de estudiantes”",
 "Sets up only two categories when students vary in countless ways.": "Plantea solo dos categorías cuando los estudiantes son diferentes de muchísimas maneras.",
 "The split screen: gray chaos vs. bright calm": "La pantalla dividida: caos gris contra calma luminosa",
 "The visual makes the false choice feel natural: stress on one side, success on the other.": "La imagen hace que la falsa elección parezca natural: estrés de un lado, éxito del otro.",
 "The glowing A on the tablet": "La A que brilla en la tableta",
 "Implies the tablet produces better grades, with no evidence.": "Implica que la tableta produce mejores calificaciones, sin evidencia.",
 "“Either you upgrade, or you fall behind”": "“O te actualizas, o te quedas atrás”",
 "The core false dilemma, with a fear of falling behind attached.": "El falso dilema central, con el miedo a quedarse atrás incluido.",
 "“The choice is yours” as the gray side fades to black": "“Tú decides” mientras el lado gris se funde a negro",
 "It offers “choice” after erasing every option but one.": "Ofrece “elegir” después de borrar todas las opciones menos una.",
 "Option finder: list at least three options the ad hides. Then compare with the investigator's list.": "Buscador de opciones: haz una lista de al menos tres opciones que el anuncio oculta. Luego compárala con la lista del investigador.",
 "Think about other devices, other study methods, and what actually helps students succeed.": "Piensa en otros dispositivos, otras formas de estudiar y lo que de verdad ayuda a los estudiantes a tener éxito.",
 "Other tablets, laptops, or the school-issued device": "Otras tabletas, laptops o el dispositivo de la escuela",
 "Paper notebooks and planners that work fine for many students": "Cuadernos y agendas de papel que funcionan bien para muchos estudiantes",
 "Free apps on a device you already have": "Apps gratuitas en un dispositivo que ya tienes",
 "Study habits, sleep, and support from teachers, which matter more than any device": "Los hábitos de estudio, el sueño y el apoyo de los maestros, que importan más que cualquier dispositivo",
 "Keeping your current device: not upgrading doesn't mean falling behind": "Quedarte con tu dispositivo actual: no actualizarte no significa quedarte atrás",
 "Genuine or false? Two of these are genuine two-option situations.": "¿Real o falso? Dos de estas son situaciones con dos opciones reales.",
 "A genuine two-option situation has a rule or fact that truly allows only two outcomes.": "Una situación con dos opciones reales tiene una regla o un hecho que de verdad permite solo dos resultados.",
 "False dilemma": "Falso dilema",
 "Genuine two options": "Dos opciones reales",
 "“Either you upgrade to Quillon Slate, or you fall behind.”": "“O te actualizas a Quillon Slate, o te quedas atrás.”",
 "Many other paths exist.": "Existen muchos otros caminos.",
 "“The early-registration deadline is Friday at 5 p.m. Either you register by then, or you pay the regular price.”": "“La fecha límite de inscripción anticipada es el viernes a las 5 p. m. O te inscribes antes, o pagas el precio regular.”",
 "The rule truly creates only two outcomes.": "La regla de verdad crea solo dos resultados.",
 "“Either you support the new schedule, or you don't care about students.”": "“O apoyas el nuevo horario, o no te importan los estudiantes.”",
 "People can care about students and still disagree about the schedule.": "Las personas pueden preocuparse por los estudiantes y aun así no estar de acuerdo con el horario.",
 "“The file either finished uploading or it didn't.”": "“El archivo terminó de subirse o no.”",
 "A completed upload is a yes-or-no fact.": "Que un archivo se haya subido es un hecho de sí o no.",
 "“You're either a math person or you're not.”": "“O eres bueno para las matemáticas, o no lo eres.”",
 "Skills develop with practice; most people are somewhere in between.": "Las habilidades se desarrollan con práctica; la mayoría de las personas está en algún punto intermedio.",
 "Rewrite “Either you upgrade, or you fall behind” so it's logically defensible but still persuasive.": "Reescribe “O te actualizas, o te quedas atrás” para que sea lógicamente defendible y siga siendo persuasivo.",
 "If you ___, Quillon Slate can help you ___.": "Si ___, Quillon Slate te puede ayudar a ___.",
 "“If you take lots of handwritten notes and want them organized and searchable, Quillon Slate is one option worth comparing.”": "“Si tomas muchas notas a mano y quieres tenerlas organizadas y fáciles de buscar, Quillon Slate es una opción que vale la pena comparar.”",
 "My rewrite names a specific benefit.": "Mi versión nombra un beneficio específico.",
 "It names who it's for.": "Dice para quién es.",
 "It leaves room for other choices.": "Deja espacio para otras opciones.",
 "It's still persuasive.": "Sigue siendo persuasiva.",
 "Is it fair for an ad aimed at students to frame not buying as “falling behind”? Explain.": "¿Es justo que un anuncio dirigido a estudiantes presente no comprar como “quedarse atrás”? Explica.",
 "This framing is ___ because ___. Students might ___.": "Este enfoque es ___ porque ___. Los estudiantes podrían ___.",
 "I explained how the false dilemma works.": "Expliqué cómo funciona el falso dilema.",
 "I considered the effect on students.": "Consideré el efecto en los estudiantes.",
 "Compare this ad with Case 3. Both frame not buying as a loss. How does a false choice combine with bandwagon pressure, and which is more persuasive for teens?": "Compara este anuncio con el Caso 3. Los dos presentan no comprar como una pérdida. ¿Cómo se combina una falsa elección con la presión de grupo, y cuál es más persuasivo para los adolescentes?",
 "Both ads ___. However, Case 3 relies on ___, while Case 4 relies on ___.": "Los dos anuncios ___. Sin embargo, el Caso 3 se basa en ___, mientras que el Caso 4 se basa en ___.",
 "“Our juice has 50% less sugar!” Less than what? If the comparison is to a soda, the juice could still be very sugary. Good investigators ask: compared to what, measured how, and according to whom?": "“¡Nuestro jugo tiene 50 % menos azúcar!” ¿Menos que qué? Si la comparación es con un refresco, el jugo todavía podría tener mucha azúcar. Quien investiga bien pregunta: ¿comparado con qué, medido cómo y según quién?",
 "Find a number in an ad you've seen (“4 out of 5,” “50% more,” “#1”). What would you need to know to trust it?": "Busca un número en un anuncio que hayas visto (“4 de cada 5”, “50 % más”, “#1”). ¿Qué necesitarías saber para confiar en él?",
 "“Forty percent higher” and the bar chart": "“Un cuarenta por ciento más” y la gráfica de barras",
 "A percentage without base numbers, on a chart whose axis starts at 45 to exaggerate the gap.": "Un porcentaje sin los números de base, en una gráfica cuyo eje empieza en 45 para exagerar la diferencia.",
 "“Over two million downloads”": "“Más de dos millones de descargas”",
 "Downloads measure popularity, not learning, and not even how many people use it.": "Las descargas miden popularidad, no aprendizaje, y ni siquiera cuántas personas la usan.",
 "“Nine out of ten students recommend”": "“Nueve de cada diez estudiantes recomiendan”",
 "Who was asked, and how many? (The data inspector reveals it.)": "¿A quién le preguntaron y a cuántos? (El inspector de datos lo revela.)",
 "“Makes you smarter”": "“Te hace más inteligente”",
 "Correlation presented as causation, then exaggerated.": "Una correlación presentada como causalidad, y además exagerada.",
 "“Up to three times faster”": "“Hasta tres veces más rápido”",
 "“Up to” describes a single best case.": "“Hasta” describe un solo caso, el mejor.",
 "“Based on internal data”": "“Basado en datos internos”",
 "No independent source, shown for under two seconds.": "Sin fuente independiente, y en pantalla menos de dos segundos.",
 "Data inspector: for each claim, write what you'd need to know first. Then reveal the hidden details. (All details are invented.)": "Inspector de datos: para cada afirmación, escribe primero lo que necesitarías saber. Luego muestra los detalles ocultos. (Todos los detalles son inventados.)",
 "“Users score 40% higher on tests.”": "“Los usuarios sacan un 40 % más en los exámenes.”",
 "Compared app quizzes: active users averaged 70; students who signed up but never used the app averaged 50. The chart's axis starts at 45.": "Se compararon cuestionarios dentro de la app: los usuarios activos promediaron 70; los estudiantes que se registraron pero nunca usaron la app promediaron 50. El eje de la gráfica empieza en 45.",
 "“On in-app practice quizzes, active users averaged 70 and inactive sign-ups averaged 50. This doesn't show the app caused the difference.”": "“En los cuestionarios de práctica dentro de la app, los usuarios activos promediaron 70 y los registrados inactivos promediaron 50. Esto no muestra que la app haya causado la diferencia.”",
 "“Over two million downloads.”": "“Más de dos millones de descargas.”",
 "About 180,000 people use it in a typical month.": "Alrededor de 180,000 personas la usan en un mes típico.",
 "“Downloaded over two million times; about 180,000 monthly active users.”": "“Descargada más de dos millones de veces; alrededor de 180,000 usuarios activos al mes.”",
 "“Nine out of ten recommend.”": "“Nueve de cada diez la recomiendan.”",
 "A pop-up shown only to users on a 30-day streak; 50 answered.": "Una ventana emergente mostrada solo a usuarios con una racha de 30 días; respondieron 50.",
 "“Of 50 users with 30-day streaks who answered an in-app survey, 45 said they'd recommend it.”": "“De 50 usuarios con rachas de 30 días que respondieron una encuesta en la app, 45 dijeron que la recomendarían.”",
 "“20 minutes a day = better grades. Makes you smarter.”": "“20 minutos al día = mejores calificaciones. Te hace más inteligente.”",
 "Students who used it daily had higher grades on average; no experiment was done.": "Los estudiantes que la usaban a diario tenían, en promedio, mejores calificaciones; no se hizo ningún experimento.",
 "“Students who used it daily tended to have higher grades. We haven't tested whether the app caused this.”": "“Los estudiantes que la usaban a diario tendían a tener mejores calificaciones. No hemos comprobado si la app causó esto.”",
 "“Up to 3× faster learning.”": "“Aprende hasta 3 veces más rápido.”",
 "One user, on one vocabulary quiz, finished three times faster on a second attempt.": "Un usuario, en un cuestionario de vocabulario, terminó tres veces más rápido en su segundo intento.",
 "Remove the claim, or report the typical result.": "Quitar la afirmación o informar el resultado típico.",
 "Match each claim with its main problem.": "Relaciona cada afirmación con su problema principal.",
 "Each claim has one main weakness. Use the data inspector's details.": "Cada afirmación tiene una debilidad principal. Usa los detalles del inspector de datos.",
 "Percent without base numbers": "Porcentaje sin números de base",
 "Popularity, not outcomes": "Popularidad, no resultados",
 "Tiny, self-selected sample": "Muestra pequeña y autoseleccionada",
 "Correlation as causation": "Correlación presentada como causalidad",
 "Best-case “up to”": "El mejor caso: “hasta”",
 "“40% higher on tests”": "“40 % más en los exámenes”",
 "Forty percent of what? 50 to 70 is 40%, and the chart exaggerates it.": "¿Cuarenta por ciento de qué? De 50 a 70 es un 40 %, y la gráfica lo exagera.",
 "“2 million downloads”": "“2 millones de descargas”",
 "Downloads aren't learning.": "Las descargas no son aprendizaje.",
 "“9 out of 10 recommend”": "“9 de cada 10 la recomiendan”",
 "Only 50 of the most enthusiastic users answered.": "Solo respondieron 50 de los usuarios más entusiastas.",
 "Higher grades among daily users doesn't show the app caused them.": "Que quienes la usan a diario tengan mejores calificaciones no muestra que la app las haya causado.",
 "“Up to 3× faster”": "“Hasta 3 veces más rápido”",
 "One user, one quiz.": "Un usuario, un cuestionario.",
 "Students who use Cramlytic daily have higher grades. What's the best alternative explanation?": "Los estudiantes que usan Cramlytic a diario tienen mejores calificaciones. ¿Cuál es la mejor explicación alternativa?",
 "Who chooses to use a study app every day?": "¿Quién elige usar una app de estudio todos los días?",
 "The app must be working": "La app debe estar funcionando",
 "That's the conclusion the ad wants, but other explanations fit the same data.": "Esa es la conclusión que quiere el anuncio, pero otras explicaciones encajan con los mismos datos.",
 "Students who already study hard are more likely to use a study app daily": "Los estudiantes que ya estudian mucho tienen más probabilidad de usar una app de estudio a diario",
 "Yes. Motivated students may choose the app and get better grades for the same reason: they study.": "Sí. Los estudiantes motivados podrían elegir la app y sacar mejores calificaciones por la misma razón: estudian.",
 "Grades are random": "Las calificaciones son al azar",
 "Grades aren't random; the issue is what causes the difference.": "Las calificaciones no son al azar; la cuestión es qué causa la diferencia.",
 "What kind of test could show whether the app causes better grades?": "¿Qué tipo de prueba podría mostrar si la app causa mejores calificaciones?",
 "Think about a fair comparison.": "Piensa en una comparación justa.",
 "Ask users if they like the app": "Preguntarles a los usuarios si les gusta la app",
 "That measures opinion, not learning.": "Eso mide opiniones, no aprendizaje.",
 "Randomly assign similar students to use or not use the app, then compare their grades": "Asignar al azar a estudiantes similares a usar o no usar la app, y luego comparar sus calificaciones",
 "Yes. Random assignment makes the two groups similar except for the app.": "Sí. La asignación al azar hace que los dos grupos sean parecidos, excepto por la app.",
 "Count how many people downloaded it": "Contar cuántas personas la descargaron",
 "Downloads don't measure learning.": "Las descargas no miden el aprendizaje.",
 "Every number in the ad might be technically true. Is the ad still dishonest? Explain using one specific claim.": "Cada número del anuncio podría ser técnicamente cierto. ¿Aun así es deshonesto el anuncio? Explica con una afirmación específica.",
 "Even if “___” is technically true, it leaves the impression that ___, which is misleading because ___.": "Aunque “___” sea técnicamente cierto, deja la impresión de que ___, lo cual es engañoso porque ___.",
 "I quoted a specific claim.": "Cité una afirmación específica.",
 "I explained the impression it creates.": "Expliqué la impresión que crea.",
 "I explained what information is missing.": "Expliqué qué información falta.",
 "I made a clear judgment.": "Hice un juicio claro.",
 "Write the evidence standard a claim like “makes you smarter” would have to meet before you'd accept it.": "Escribe el estándar de evidencia que una afirmación como “te hace más inteligente” tendría que cumplir antes de que la aceptaras.",
 "Before accepting this claim, I'd need ___, collected by ___, with ___ participants, measuring ___.": "Antes de aceptar esta afirmación, necesitaría ___, recopilado por ___, con ___ participantes, que mida ___.",
 "An ethical gym ad might say: “First month free. Classes for every fitness level, with certified trainers.” It still persuades (a free offer, a welcoming tone), but every claim is checkable and nothing scares or pressures you.": "Un anuncio ético de un gimnasio podría decir: “Primer mes gratis. Clases para todos los niveles, con entrenadores certificados.” Sigue persuadiendo (una oferta gratuita, un tono acogedor), pero cada afirmación se puede comprobar y nada te asusta ni te presiona.",
 "Think of a product you actually like. Write one honest, persuasive sentence an ad could use for it.": "Piensa en un producto que de verdad te guste. Escribe una oración honesta y persuasiva que un anuncio podría usar.",
 "“Dehydration could be silently ruining your day”": "“La deshidratación podría estar arruinando tu día en silencio”",
 "Inflates a common feeling into a hidden threat.": "Convierte un sentimiento común en una amenaza oculta.",
 "“Trainer-approved by Jade Kessler” and “2M followers”": "“Aprobada por la entrenadora Jade Kessler” y “2 millones de seguidores”",
 "A follower count isn't expertise, and “approved” doesn't say what was tested or whether she was paid.": "El número de seguidores no es experiencia, y “aprobada” no dice qué se probó ni si le pagaron.",
 "“37% more energy”": "“37 % más energía”",
 "No source, no sample, no definition of “energy,” and it's self-reported.": "Sin fuente, sin muestra, sin definir qué es “energía”, y basado en lo que las personas reportan.",
 "“Join five million people”": "“Únete a cinco millones de personas”",
 "Unverified and irrelevant to whether the bottle helps.": "No está comprobado y no tiene que ver con si la botella ayuda.",
 "“Either you track your water, or you're guessing with your health”": "“O registras tu agua, o estás adivinando con tu salud”",
 "People drink enough water without tracking every sip.": "La gente toma suficiente agua sin registrar cada trago.",
 "“Holds 24 ounces, cold for 12 hours”": "“Capacidad de 24 onzas, fría por 12 horas”",
 "Specific, testable product facts. Keep these in your rewrite!": "Datos del producto específicos y comprobables. ¡Consérvalos en tu versión!",
 "“The last bottle you'll ever need”": "“La última botella que necesitarás”",
 "An exaggeration no product could support.": "Una exageración que ningún producto podría respaldar.",
 "Final reflection: How is your rewrite both persuasive and responsible? What did you keep, cut, and add?": "Reflexión final: ¿Cómo es tu versión persuasiva y responsable a la vez? ¿Qué conservaste, qué quitaste y qué añadiste?",
 "I kept ___ because ___. I cut ___ because ___. My version still persuades by ___.": "Conservé ___ porque ___. Quité ___ porque ___. Mi versión todavía persuade al ___.",
 "My claims are supported or clearly qualified.": "Mis afirmaciones están respaldadas o claramente matizadas.",
 "My emotional appeal fits the facts.": "Mi apelación emocional corresponde a los hechos.",
 "I didn't use a false choice.": "No usé una falsa elección.",
 "Any endorser is relevant and disclosed.": "Cualquier persona que respalde el producto es pertinente y se aclara su relación.",
 "The audience can make an informed decision.": "El público puede tomar una decisión informada.",
 "Write a short creative brief for one specific audience (for example, student athletes or office workers). How does your strategy change for that audience without becoming manipulative?": "Escribe un breve resumen creativo para un público específico (por ejemplo, estudiantes atletas o personas que trabajan en oficina). ¿Cómo cambia tu estrategia para ese público sin volverse manipuladora?",
 "For ___, I would emphasize ___ because ___, while avoiding ___.": "Para ___, destacaría ___ porque ___, evitando ___.",
 "“Busy days make it easy to forget to drink water. Sipwarden's cap glows when it's been a while since your last sip, and the app shows your progress if you like keeping track. It holds 24 ounces and keeps drinks cold for 12 hours. If reminders help you, Sipwarden makes them easy.”": "“Con días ocupados es fácil olvidarse de tomar agua. La tapa de Sipwarden brilla cuando ha pasado un rato desde tu último trago, y la app muestra tu progreso si te gusta llevar la cuenta. Tiene capacidad de 24 onzas y mantiene las bebidas frías por 12 horas. Si los recordatorios te ayudan, Sipwarden los hace fáciles.”",
 "1. Central claim": "1. Afirmación central",
 "What is the ad's main message or claim?": "¿Cuál es el mensaje o la afirmación principal del anuncio?",
 "The ad's central claim is that ___.": "La afirmación central del anuncio es que ___.",
 "2. Intended audience": "2. Público objetivo",
 "Who is the ad for? What evidence in the ad tells you?": "¿Para quién es el anuncio? ¿Qué evidencia en el anuncio te lo indica?",
 "The ad targets ___, as shown by ___.": "El anuncio está dirigido a ___, como se ve en ___.",
 "3. Rhetorical appeals": "3. Apelaciones retóricas",
 "Identify at least two appeals, each with a specific moment.": "Identifica al menos dos apelaciones, cada una con un momento específico.",
 "The ad uses ___ when it ___. It also uses ___ when ___.": "El anuncio usa ___ cuando ___. También usa ___ cuando ___.",
 "4. Evidence": "4. Evidencia",
 "Give a specific example of the evidence the ad uses, or explain that it offers none.": "Da un ejemplo específico de la evidencia que usa el anuncio, o explica que no ofrece ninguna.",
 "The ad supports its claim with ___. / The ad offers no evidence for ___.": "El anuncio respalda su afirmación con ___. / El anuncio no ofrece evidencia de ___.",
 "5. Fallacies or misleading reasoning": "5. Falacias o razonamiento engañoso",
 "Identify any fallacy or misleading reasoning that is actually present. If there is none, write “None found” and explain why.": "Identifica cualquier falacia o razonamiento engañoso que de verdad esté presente. Si no hay ninguno, escribe “No encontré ninguna” y explica por qué.",
 "The ad uses ___ because ___. / None found: ___.": "El anuncio usa ___ porque ___. / No encontré ninguna: ___.",
 "6. Credibility": "6. Credibilidad",
 "How credible is the ad? Consider sources, expertise, and independence.": "¿Qué tan creíble es el anuncio? Considera las fuentes, la experiencia y la independencia.",
 "The ad is ___ credible because ___.": "El anuncio es ___ creíble porque ___.",
 "7. Overall judgment": "7. Juicio general",
 "How effective is the ad, and how ethical? Judge both, separately.": "¿Qué tan efectivo es el anuncio y qué tan ético? Juzga las dos cosas por separado.",
 "The ad is effective because ___. Ethically, it is ___ because ___.": "El anuncio es efectivo porque ___. Éticamente, es ___ porque ___.",
 "Identification of persuasive strategies": "Identificación de estrategias persuasivas",
 "Names two or more appeals accurately and explains how they work together": "Nombra con exactitud dos o más apelaciones y explica cómo funcionan juntas",
 "Names two appeals accurately": "Nombra con exactitud dos apelaciones",
 "Names one appeal accurately, or two with an error": "Nombra con exactitud una apelación, o dos con un error",
 "Names appeals inaccurately or not at all": "Nombra las apelaciones de forma inexacta o no las nombra",
 "Quality of evidence": "Calidad de la evidencia",
 "Cites precise moments (words, images, sounds) for every claim": "Cita momentos precisos (palabras, imágenes, sonidos) para cada afirmación",
 "Cites specific moments for most claims": "Cita momentos específicos para la mayoría de las afirmaciones",
 "Cites general or vague evidence": "Cita evidencia general o vaga",

      <h2>Adding the videos</h2><p>Export each finished ad as MP4 and add it to <code>assets/videos/</code> with these names. Captions go in <code>assets/captions/</code>; draft caption files are already there and should be retimed to the final edit.</p>
      <div class="tablewrap"><table><thead><tr><th scope="col">Case</th><th scope="col">Video</th><th scope="col">Captions</th></tr></thead><tbody>${D.CASES.map(c => `<tr><td>${c.id}</td><td><code>assets/videos/${c.file}.mp4</code></td><td><code>${c.file}.en.vtt</code>, <code>${c.file}.es.vtt</code></td></tr>`).join("")}</tbody></table></div>
